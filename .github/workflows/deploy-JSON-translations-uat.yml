name: Deploy JSON Translations to UAT

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.UAT_SSH_HOST }}" ]; then
            echo "❌ UAT_SSH_HOST secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.UAT_SSH_USER }}" ]; then
            echo "❌ UAT_SSH_USER secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.UAT_SSH_KEY }}" ]; then
            echo "❌ UAT_SSH_KEY secret is missing"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Avoid ssh-keyscan failure blocking pipeline
          ssh-keyscan -H "${{ secrets.UAT_SSH_HOST }}" >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy translations on UAT server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} << 'EOF'
            set -e

            echo "🔹 Switching to Tutor user"
            sudo -u ${{ secrets.UAT_TUTOR_USER }} bash << 'INNER_EOF'
              set -e

              echo "🔹 Moving to Tutor directory"
              cd ${{ secrets.UAT_TUTOR_PATH }}

              echo "🔹 Activating Tutor virtualenv"
              source tutor-env/bin/activate

              echo "🔹 Stopping Open edX"
              tutor local stop

              echo "🔹 Building Open edX image with updated translations"
              tutor images build mfe --no-cache

              echo "🔹 Starting Open edX"
              tutor local start -d

              echo "✅ Deployment completed successfully"
            INNER_EOF
          EOF
